server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 单页应用：静态文件优先，其余回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带哈希的静态资源可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
